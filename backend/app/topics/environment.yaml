topics:
  - id: environment-001
    title: 限塑令的意义
    description: 超市不再提供免费塑料袋了，但这真的能减少塑料污染吗？
    category: environment
    age_range: "8-12"
    guide_questions:
      - 你家里会自带购物袋去超市吗？
      - 少用一个塑料袋真的有用吗？
      - 如果所有人都不用塑料袋，世界会怎样？
    tags: [限塑令, 塑料污染, 环保行动, 个人责任]
    story: |
      2020年，中国正式实施"限塑令升级版"，要求超市、商场不再提供免费塑料袋。很多人觉得不方便，甚至觉得"一个塑料袋能改变什么"。

      但数据触目惊心：全球每年生产超过3亿吨塑料，其中800万吨流入海洋。在太平洋上，有一个由垃圾组成的"岛屿"，面积相当于3个法国。一只海龟的胃里曾被发现有超过100片塑料碎片。

      有人说，一个塑料袋在地球上需要200-1000年才能完全分解。也就是说，你爷爷的爷爷如果用过一个塑料袋，它可能到现在还没有消失。

      当然也有人质疑：限塑令只是把塑料袋换成了更厚的可降解袋或纸袋，生产这些替代品同样消耗资源。真正的环保，是不是应该从"少买、多用"开始？
    story_source: 联合国环境规划署塑料污染报告
    suggested_thinkers: []

  - id: environment-002
    title: 动物有没有感情
    description: 我们养宠物、去动物园，但动物真的有感情吗？我们该怎样对待它们？
    category: environment
    age_range: "8-12"
    guide_questions:
      - 你的宠物会"伤心"吗？你怎么知道的？
      - 动物园对动物来说是"家"还是"监狱"？
      - 如果动物有感情，我们还应该吃肉吗？
    tags: [动物保护, 动物权利, 同理心, 生命尊重]
    story: |
      科学家发现，大象会在同伴去世后久久不愿离开，甚至用树枝和泥土"掩埋"死去的伙伴。海豚会给受伤的同伴"托举"到水面呼吸。乌鸦会记住伤害过它的人的脸长达五年。

      2012年，一群顶级神经科学家在剑桥大学发表了《关于意识的剑桥宣言》，正式承认动物拥有"有意识的体验"。这意味着，动物不仅仅是"本能反应的机器"，它们能感受到疼痛、恐惧、甚至快乐。

      但这带来了一个难题：如果动物有感情，我们把它们关在笼子里供人观赏、用来做实验、养大了吃掉——这些做法还对吗？有人认为应该废除所有动物利用，也有人认为适度利用是人类文明的基础。你怎么看？
    story_source: 剑桥意识宣言 / 动物行为学研究
    suggested_thinkers: []

  - id: environment-003
    title: 垃圾分类有用吗
    description: 每天分类垃圾很麻烦，但如果不分类，垃圾最终会去哪里？
    category: environment
    age_range: "8-12"
    guide_questions:
      - 你知道你扔掉的垃圾最后去了哪里吗？
      - 如果全班同学都不分类垃圾，会怎样？
      - 怎样才能让垃圾分类变得更简单？
    tags: [垃圾分类, 环境保护, 资源回收, 公民责任]
    story: |
      2019年，上海率先实施垃圾分类制度，一时间"你是什么垃圾？"成了网络热词。很多人抱怨分类太复杂，也有人质疑：就算我认真分类了，垃圾车不是还混在一起拉走吗？

      事实上，日本从1970年代就开始垃圾分类，有些城市把垃圾分成40多种。经过几十年努力，日本的垃圾回收率达到了84%，远高于很多国家。而在一些没有分类的地方，垃圾只能被填埋或焚烧，填埋会污染地下水，焚烧会产生有害气体。

      一个有趣的例子：瑞典的垃圾分类和回收做得太好了，以至于他们的焚烧发电厂"没有垃圾烧"，不得不从其他国家进口垃圾。这是一个值得思考的故事——当环保做到极致时，它可以变成一种资源。
    story_source: 日本垃圾分类经验 / 瑞典循环经济案例
    suggested_thinkers: []

  - id: environment-004
    title: 低碳生活离我们远吗
    description: 人人都说要"低碳"，但一个小学生的"碳足迹"有多大？
    category: environment
    age_range: "8-14"
    guide_questions:
      - 你知道"碳足迹"是什么意思吗？
      - 坐飞机和坐火车，哪个更环保？为什么？
      - 小学生能为减碳做什么？
    tags: [碳足迹, 气候变化, 低碳生活, 全球变暖]
    story: |
      如果把地球的历史压缩成一天24小时，人类出现在最后1秒。但就在这"1秒"里，我们排放了大量的二氧化碳，使地球的平均温度已经比工业革命前升高了约1.1°C。

      听起来1.1度不多，但这意味着北极冰川加速融化，海平面上升，极端天气更加频繁。科学家们说，如果温度再升高0.5度，很多小岛国家可能会被淹没。

      一个中国城市家庭的平均碳排放大约是每年8-10吨二氧化碳。其中，用电、开车、吃肉是最大的"碳来源"。有一个有趣的计算：每天少开30分钟空调，一年可以减少约200千克碳排放——相当于种十棵树的效果。

      但也有人说：个人减碳的效果微乎其微，真正需要改变的是工厂和能源结构。那小学生关心低碳，到底有没有意义？
    story_source: IPCC气候报告 / 世界资源研究所数据
    suggested_thinkers: []

  - id: environment-005
    title: 保护濒危动物谁来买单
    description: 大熊猫的保护每年花费数亿元，这些钱值得花吗？
    category: environment
    age_range: "10-14"
    guide_questions:
      - 为什么要花这么多钱保护一种动物？
      - 如果这笔钱用来帮助贫困儿童，你觉得更值得吗？
      - 保护动物和发展经济矛盾吗？
    tags: [濒危物种, 生态保护, 资源分配, 自然价值]
    story: |
      中国每年在大熊猫保护上花费超过2亿元人民币。全球每年用于保护濒危物种的资金超过200亿美元。有人提出了一个尖锐的问题：在还有数亿人吃不饱饭的世界里，花这么多钱保护动物，值得吗？

      支持者说：每种生物的灭绝都会影响整个生态链。蜜蜂消失了，70%的农作物将无法授粉，人类也会饿肚子。保护动物不是"浪费钱"，而是保护我们自己。

      反对者说：保护的成本太高了，而且有些物种本来就在自然淘汰中。恐龙灭绝了，地球照样转。把有限的资源优先给人类不是更合理吗？

      还有一种声音：问题不是"该不该保护"，而是"谁来保护"。大量生物灭绝的根本原因是人类活动——砍伐森林、排放污染、过度捕猎。如果是人类造成的问题，是不是应该由人类来解决？
    story_source: 世界自然基金会WWF年度报告
    suggested_thinkers: []

  - id: environment-006
    title: 水是用不完的吗
    description: 打开水龙头就有水，但地球上的淡水真的够用吗？
    category: environment
    age_range: "8-12"
    guide_questions:
      - 你一天会用多少水？想过吗？
      - 如果有一天打开水龙头没水了，你会怎么办？
      - 节约用水和科技发展哪个更重要？
    tags: [水资源, 节约用水, 淡水危机, 资源管理]
    story: |
      地球上97.5%的水是海水（又咸又苦不能喝），淡水只有2.5%。而这2.5%中的大部分被冻在南极和北极的冰盖里。真正能被人类直接使用的淡水，不到地球总水量的0.3%。

      联合国预测，到2025年，全球将有18亿人生活在"绝对缺水"地区。在非洲一些国家，很多孩子每天要步行数公里去打水，而这些水往往还不干净。

      中国是一个"水资源大国"，但人均水资源只有世界平均水平的四分之一。北方城市尤其缺水——北京的人均水资源比以色列还少。

      有趣的是，科技已经有了解决方案：海水淡化、污水回用、雨水收集。但这些技术都很贵。问题变成了：是先花钱建海水淡化厂，还是先教大家节约用水？
    story_source: 联合国水资源报告 / 中国水利部数据
    suggested_thinkers: []

  - id: environment-007
    title: 树木有生命权吗
    description: 为了建学校砍掉一片树林，你觉得合理吗？
    category: environment
    age_range: "8-14"
    guide_questions:
      - 一棵树和一座学校，哪个更重要？
      - 植物算不算"生命"？它们有"权利"吗？
      - 如果一棵树活了100年，砍掉它需要什么理由？
    tags: [植物生命, 自然权利, 发展与保护, 生态平衡]
    story: |
      德国有一片"会说话"的森林——护林员彼得·渥雷本写了一本畅销书《树的秘密生活》，揭示了令人震惊的事实：树木通过地下的菌丝网络互相通信，"母树"会通过根系给小树苗输送养分，受伤的树会释放化学物质警告邻居。

      2008年，厄瓜多尔成为世界上第一个把"自然权利"写入宪法的国家——规定大自然有"存在、繁衍和再生的权利"。这意味着，如果有人要砍树建工厂，树木可以通过法律代理人"打官司"。

      但在另一边，全球每年有1000万公顷的森林被砍伐（差不多相当于一个韩国）。大部分是为了农业、建筑和造纸。如果不砍树，人类的很多基本需求怎么满足？

      这是一个经典的两难：发展和保护能两全吗？
    story_source: 彼得·渥雷本《树的秘密生活》/ 厄瓜多尔宪法
    suggested_thinkers: []

  - id: environment-008
    title: 电子产品的"隐形垃圾"
    description: 手机每年换新，旧手机去哪了？电子垃圾正在成为新的环境问题。
    category: environment
    age_range: "10-14"
    guide_questions:
      - 你家里有多少不用的旧手机？它们在哪？
      - 一部手机从生产到回收，会产生多少污染？
      - 怎样才能让电子产品更"环保"？
    tags: [电子垃圾, 科技环保, 循环利用, 消费主义]
    story: |
      2022年，全球产生了约5400万吨电子垃圾——如果把这些废弃的手机、电脑、电视堆起来，比长城还重。而其中只有不到20%被正规回收处理。

      一部手机的制造需要开采超过30种矿物，包括稀有的钴和锂。开采这些矿物会破坏生态、污染水源。在非洲刚果（金），很多孩子被迫在矿山工作，挖掘用于生产手机电池的钴矿石。

      更令人担忧的是，很多电子垃圾被运到发展中国家"处理"——实际上就是在露天焚烧或酸洗，释放出铅、汞等有毒物质，严重危害当地居民的健康。

      科技公司也在尝试改变：苹果推出了回收机器人"Daisy"，能拆解9种iPhone；欧盟要求手机必须使用统一的USB-C接口以减少浪费。但根本问题是——我们真的需要每年换一部新手机吗？
    story_source: 联合国电子垃圾监测报告 / 苹果环境责任报告
    suggested_thinkers: []

  - id: environment-009
    title: 光盘行动有道理吗
    description: 每年有大量食物被浪费，但"光盘"真的是对的吗？
    category: environment
    age_range: "8-12"
    guide_questions:
      - 你在学校食堂会把饭菜吃完吗？
      - 如果菜不好吃也必须吃完吗？
      - 减少食物浪费最好的办法是什么？
    tags: [食物浪费, 光盘行动, 粮食安全, 节约习惯]
    story: |
      中国每年浪费的食物约为3500万吨，够2亿人吃一年。全球每年浪费的食物高达13亿吨，约占全球粮食产量的三分之一。

      2020年，"光盘行动"在全国推广，很多餐厅开始提供"半份菜"，学校食堂设立了"光盘打卡"。但也有人觉得不舒服：如果菜做得不好吃，也必须吃完吗？这是节约还是强迫？

      食物浪费的真正问题在"看不见的地方"——从农田到餐桌，大量食物在运输、储存、加工过程中损失。在一些发达国家，超市因为"卖相不好"就扔掉了30%的新鲜蔬果。

      有趣的是，法国在2016年通过了一项法律：禁止超市丢弃可食用的食物，必须捐给慈善机构。这个做法在减少浪费的同时帮助了需要帮助的人。
    story_source: 联合国粮农组织FAO报告 / 法国反食物浪费法
    suggested_thinkers: []

  - id: environment-010
    title: 城市需要那么多绿地吗
    description: 寸土寸金的城市里，公园和绿地真的必要吗？
    category: environment
    age_range: "10-14"
    guide_questions:
      - 你家附近有公园吗？你多久去一次？
      - 如果把公园改建成住宅，你同意吗？
      - 城市里的树和草地有什么用？
    tags: [城市绿化, 城市规划, 生活品质, 人与自然]
    story: |
      新加坡被称为"花园城市"，绿化覆盖率超过50%。纽约的中央公园面积341公顷，据估算每年为城市提供约1.6亿美元的生态服务价值——包括净化空气、降低温度、吸收雨水。

      研究发现，住在绿地附近的人心理健康明显更好。在疫情期间，有公园可去的社区居民的焦虑和抑郁比例明显低于没有绿地的社区。

      但城市用地非常紧张。在北京、上海这样的大城市，一平方米的土地价值数万元。把宝贵的土地用来种草种树，而不是建房子或商场，经济上划算吗？

      有一种折中方案：垂直绿化和屋顶花园。新加坡要求所有新建筑必须有"等面积的绿化补偿"——如果你盖了一栋楼，就要在楼顶或墙面种同样面积的植物。
    story_source: 新加坡城市绿化政策 / 纽约中央公园经济价值研究
    suggested_thinkers: []
