category: ethics
category_cn: 伦理
topics:
  - id: ethics-001
    title: 电车难题
    description: 一辆失控的电车将撞死五个人，你可以拉动拉杆让电车转向另一条轨道，但会撞死一个人。你拉还是不拉？
    category: ethics
    age_range: "8-14"
    guide_questions:
      - 五条命和一条命能比较吗？
      - '不做选择本身也是一种选择吗？'
      - 如果你认识那一个人，你会改变决定吗？
    tags: [电车难题, 功利主义, 义务论, 道德]
    story: |
      1967年，英国哲学家菲利帕·福特提出了一个思想实验：一辆失控的电车正冲向轨道上的五个人，你站在拉杆旁，只要拉动拉杆，电车就会转到另一条轨道上，但那条轨道上有一个人。你拉还是不拉？

      这个看似简单的问题引发了半个世纪的哲学争论。功利主义者说当然要拉——五条命大于一条命。义务论者说不应该拉——你不能主动去杀害一个人来拯救五个人，哪怕结果更好。

      后来人们提出了各种变体：如果是把一个胖子从桥上推下去来挡住电车呢？大多数人认为推胖子是错的——为什么？同样是牺牲一人救五人，拉杆和推胖子有什么本质区别？也许区别在于，拉杆是"改变方向"（已有的伤害），推胖子是"主动制造"新的伤害。

      电车难题没有标准答案，它像一面镜子，照出你内心深处对道德的判断标准。你在生活中也许永远不会遇到电车，但类似的权衡无处不在——医疗资源分配、战争中的平民伤亡、疫情防控的取舍……
    story_source: 菲利帕·福特《堕胎问题与教条双重效应》
    suggested_thinkers: [utilitarianism, kant]

  - id: ethics-002
    title: 说谎永远不对吗
    description: 如果纳粹来敲门询问犹太人的藏身处，你撒谎救人是错吗？康德说谎永远不对，但常识说当然要说谎救人。
    category: ethics
    age_range: "10-14"
    guide_questions:
      - 善意的谎言和恶意的谎言有什么区别？
      - 有没有"必须撒谎"的情况？
      - 说真话和做好人冲突时，你怎么选？
    tags: [谎言, 康德, 道德, 诚信]
    story: |
      18世纪德国哲学家康德认为，说谎永远是不对的——不是因为它通常造成坏结果，而是因为说谎违背了理性本身的法则。如果每个人都按"只要有利就可以撒谎"的原则行动，那么承诺和语言本身就会失去意义。他甚至说，如果一个凶手问你他的目标在哪里，你应该说实话。

      大多数人听到这个例子都觉得康德太过极端了。在二战中，许多人为了保护犹太人而向纳粹撒谎——这些谎言显然是道德的。安妮·弗兰克一家在阿姆斯特丹的密室中藏了两年，帮助他们的米普·吉斯等人向纳粹撒了无数次谎。

      但康德的观点也有道理：如果我们接受"有时可以撒谎"，那界限在哪里？谁来判断什么时候可以？如果每个人按自己的判断来决定何时撒谎，社会信任就会被侵蚀。也许问题不在于"能不能撒谎"，而在于我们如何建立一种不依赖谎言的社会。哲学家本杰明·康斯坦特反驳说："对说真话者说真话，对凶手说真话是犯罪。"你怎么看？
    story_source: 康德《论所谓出于博爱的说谎权》
    suggested_thinkers: [kant, confucius]

  - id: ethics-003
    title: 动物的权利
    description: 我们吃肉、穿皮、用动物做实验——这些行为道德吗？动物有权利吗？
    category: ethics
    age_range: "8-14"
    guide_questions:
      - 人类对待动物的方式和种族歧视有什么相似之处？
      - 如果动物能感到痛苦，这是否给了它们权利？
      - 你愿意为动物福利放弃多少便利？
    tags: [动物权利, 物种主义, 伦理, 环保]
    story: |
      1975年，澳大利亚哲学家彼得·辛格出版了《动物解放》一书，提出了一个震撼性的论点：我们对动物的态度，和种族歧视、性别歧视一样，是一种"物种主义"——仅仅因为它们不是人类，就否认它们的基本权利。

      辛格的论证很简单：如果一个生物能感受痛苦，我们就没有理由忽视它的痛苦，无论它是人还是动物。工厂化养殖中的鸡被关在比A4纸还小的笼子里，猪的尾巴被无麻醉切除，实验动物被强制喂食毒性物质直到死亡——如果我们对人类这样做，那就是酷刑，为什么对动物就可以？

      反对者说，动物没有理性、没有道德感、不能履行义务，因此也不享有权利。但辛格反驳：婴儿和智障人士也没有这些能力，我们不否认他们的权利。权利的基础不是智力，而是感受痛苦的能力。

      当然，完全不吃肉、不用任何动物制品，在现实中很难做到。但了解这些事实后，你会不会重新思考每天的选择？
    story_source: 彼得·辛格《动物解放》
    suggested_thinkers: [singer, confucius]

  - id: ethics-004
    title: 正义战争存在吗
    description: 有些战争是为了自卫，有些是为了解放被压迫者。战争可以正义吗？
    category: ethics
    age_range: "10-14"
    guide_questions:
      - 什么条件下开战是正当的？
      - 平民的伤亡可以接受吗？多少？
      - 战争的正义性由谁判断？
    tags: [战争, 正义, 和平, 国际法]
    story: |
      公元5世纪，基督教神学家奥古斯丁提出了"正义战争"理论：战争要正当，必须满足几个条件——有正当理由（如自卫）、由合法权威发起、出于正当意图、是最后手段、成功的可能性合理，且预期的好处要大于伤害。

      二战中，盟军对抗纳粹德国的战争被大多数人视为正义战争——希特勒在实施种族灭绝，不反击就意味着纵容。但即使在"正义"的战争中，也发生了不正义的行为：盟军对德累斯顿的轰炸造成了约2.5万平民死亡，对广岛和长崎投下原子弹更是瞬间杀死了数十万人。

      反战者说，没有正义的战争，只有更不正义的和平。马丁·路德·金说："暴力永远无法消灭暴力，只有非暴力才能做到。"甘地用非暴力抵抗赢得了印度的独立。但当面对种族灭绝时，非暴力还有效吗？卢旺达大屠杀中，国际社会的旁观导致了80万人死亡。如果当时有人武力干预，是不是更正义？
    story_source: 迈克尔·沃尔泽《正义与非正义战争》
    suggested_thinkers: [socrates, hannah-arendt]

  - id: ethics-005
    title: 富有者有义务帮助穷人吗
    description: 全球最富有的1%人口拥有全球近一半的财富。富裕的人和国家有道德义务帮助穷人吗？
    category: ethics
    age_range: "10-14"
    guide_questions:
      - 慈善是美德还是义务？
      - 你的富裕和别人的贫穷有关系吗？
      - 帮助穷人的最佳方式是什么？
    tags: [贫富差距, 正义, 慈善, 全球化]
    story: |
      彼得·辛格讲了一个故事：你走过一个浅水池，看到一个小孩正在溺水。你可以轻松救起他，但这会弄脏你昂贵的衣服。大多数人会说，你当然应该救那个孩子——衣服的价值远不如一条命。

      辛格接着说，全球每天都有孩子死于可预防的疾病——疟疾、腹泻、营养不良——而救助一个孩子的费用可能只是你一顿饭钱。如果你愿意为救眼前的孩子弄脏衣服，为什么不愿意为救远方的孩子捐出同样的钱？

      哲学家托马斯·博格提出了更激进的观点：全球贫穷不是自然灾害，而是不公正的全球秩序造成的。富国制定的国际贸易规则、知识产权制度、债务结构，系统性地让穷国更穷。所以问题不是"富有者是否应该慈善"，而是"富有者是否应该停止掠夺"。

      也有人反驳说，个人慈善解决不了系统性问题，而且强制分配财富会打击积极性。你怎么看？
    story_source: 彼得·辛格《饥荒、富裕与道德》
    suggested_thinkers: [rawls, confucius]

  - id: ethics-006
    title: 惩罚的目的是什么
    description: 有人犯罪后，我们惩罚他是为了报复、威慑还是改造？如果惩罚不能防止犯罪，我们还要惩罚吗？
    category: ethics
    age_range: "10-14"
    guide_questions:
      - 报复和正义有什么区别？
      - 如果惩罚无法威慑任何人，还应该惩罚吗？
      - 应该优先改造罪犯还是补偿受害者？
    tags: [惩罚, 正义, 刑法, 改造]
    story: |
      2011年，挪威发生了一起震惊世界的枪击案——安德斯·布雷维克杀害了77人。他被判处21年监禁（挪威最高刑期），关在一间有书房、健身房和电视的单人牢房中。很多国家的人觉得这个惩罚太轻了——77条命只换21年？

      挪威的刑罚哲学是"修复式正义"——惩罚的目的不是报复，而是改造犯人，使其将来能重新融入社会。挪威的再犯率只有20%，而以惩罚为导向的美国再犯率高达67%。

      惩罚有四种传统理由：报复（犯人应受苦）、威慑（让其他人害怕）、隔离（防止再犯）和改造（帮助犯人变好）。不同社会和文化对这些理由的权重不同。中国古代的法家强调"以刑去刑"——严厉的惩罚可以威慑犯罪。而儒家更强调"教化"——通过教育使人不愿犯罪。

      如果布雷维克永远无法改造（他自己声称不会悔改），那么21年够吗？或者，我们惩罚他，本身就是一种"他应得的"，无论有没有其他效果？
    story_source: 挪威刑事司法制度报道
    suggested_thinkers: [kant, mencius]

  - id: ethics-007
    title: 你会按下快乐按钮吗
    description: 如果有一个按钮，按下后你将永远感到快乐，但你的生活不会有任何真实的成就或关系。你按吗？
    category: ethics
    age_range: "8-14"
    guide_questions:
      - 虚假的快乐和真实的痛苦，哪个更有价值？
      - 没有痛苦的人生还是完整的人生吗？
      - 快乐是人生的唯一目标吗？
    tags: [快乐, 经验机器, 功利主义, 人生意义]
    story: |
      哲学家罗伯特·诺齐克提出了"经验机器"的思想实验：想象一台超级机器，可以给你任何你想体验的感觉——你可以体验写出一部伟大小说的成就感、和理想伴侣相爱的甜蜜、登上珠峰的壮观……这些体验和真实经历完全一样，你不会知道自己在机器中。你愿意终身接入这台机器吗？

      大多数人说"不愿意"。为什么？如果快乐是人生唯一有价值的东西，那经验机器就是最优选择。但诺齐克指出，我们想要的不仅是"体验"，我们还想要"真实地存在"——我们想真正做事情，而不是只有做事的感觉；我们想真正和他人建立关系，而不是只有被爱的感觉。

      这个思想实验挑战了功利主义的核心假设：好的生活就是快乐更多的生活。如果快乐不是唯一重要的东西，那还有什么？也许重要的是真实性、自主性、成长和与他人的真实联系。

      在社交媒体时代，我们每天都在获得"虚假的快乐"——点赞、关注、算法推送的娱乐内容。我们是不是已经在某种程度上生活在"经验机器"中了？
    story_source: 罗伯特·诺齐克《无政府、国家和乌托邦》
    suggested_thinkers: [utilitarianism, socrates]

  - id: ethics-008
    title: 无知之幕下的公正
    description: 如果你在设计社会规则时不知道自己会是富人还是穷人，你会设计什么样的社会？
    category: ethics
    age_range: "10-14"
    guide_questions:
      - 如果你是社会中最不幸的人，你希望社会怎样对待你？
      - 不平等在任何情况下都是合理的吗？
      - 你认为最重要的社会价值是什么？自由？平等？效率？
    tags: [正义论, 罗尔斯, 无知之幕, 平等]
    story: |
      1971年，美国哲学家约翰·罗尔斯出版了《正义论》，提出了一个天才的思想实验——"无知之幕"。想象你要设计一个社会的规则，但你不知道自己在这个社会中会是什么人——不知道自己的性别、种族、财富、智力、健康、家庭背景。在这种"无知"状态下，你会设计什么样的社会？

      罗尔斯认为，理性的人在无知之幕后会同意两个原则：第一，每个人都享有平等的基本自由；第二，社会和经济的不平等只有在有利于最弱势群体的条件下才是可接受的。第二个原则被称为"差异原则"——不是消灭不平等，而是确保不平等对所有人有利。

      举例：医生收入比清洁工高可以接受吗？如果这种收入差异激励了更多人成为医生，而好的医疗体系对最穷的人也最有价值（因为他们最看不起病），那就可以接受。但如果收入差异只是让富人更富，对最穷的人没有帮助，那就不正义。

      当然，也有批评者：自由主义者说差异原则侵犯了个人自由；功利主义者说应该追求总体幸福最大化，而非关注最弱势群体。你觉得在无知之幕后，你会怎么选？
    story_source: 约翰·罗尔斯《正义论》
    suggested_thinkers: [rawls, nozick]

  - id: ethics-009
    title: 自由与安全的权衡
    description: 为了安全，我们可以放弃多少自由？政府监控能防止恐怖主义，但也侵犯了隐私。
    category: ethics
    age_range: "10-14"
    guide_questions:
      - 隐私是基本权利还是奢侈？
      - '如果你没做坏事，就不用担心监控对吗？'
      - 安全和自由能兼得吗？
    tags: [自由, 安全, 隐私, 监控]
    story: |
      2013年，前美国国家安全局雇员爱德华·斯诺登披露了一个震惊世界的秘密：美国政府正在大规模监控全球公民的通信——电话记录、电子邮件、网络活动都在监控范围内。这个名为"棱镜"的项目声称是为了反恐，但它也监控了数百万普通公民。

      本杰明·富兰克林说过："那些为了暂时的安全而放弃基本自由的人，既不配拥有自由，也不配拥有安全。"但支持监控的人说，恐怖主义是真实的威胁——9/11事件夺走了近3000条命，如果监控能防止下一次袭击，侵犯隐私是值得的。

      问题的复杂性在于："安全"和"自由"都是人们珍视的价值，而且两者之间的界限模糊。疫情中，追踪感染者的手机位置数据可以救命，但也可能被滥用。人脸识别可以抓捕罪犯，也可能成为社会控制的工具。

      更深层的问题是：谁决定安全与自由的边界？政府说"相信我们"，但斯诺登的揭露证明政府也会滥用权力。也许，真正的安全不在于放弃自由，而在于建立一个有监督的透明机制。
    story_source: 斯诺登泄密事件
    suggested_thinkers: [hannah-arendt, foucault]

  - id: ethics-010
    title: 我们对后代有什么义务
    description: 我们的碳排放将在几百年后造成严重后果。我们对尚未出生的人有道德义务吗？
    category: ethics
    age_range: "10-14"
    guide_questions:
      - 尚未出生的人有权利吗？
      - 我们应该为多远的未来负责？
      - 享受当下和为后代牺牲之间如何平衡？
    tags: [代际正义, 气候变化, 未来, 责任]
    story: |
      2023年，全球碳排放量创下历史新高。科学家警告，如果继续目前的排放速度，到2100年全球平均温度可能上升3-4度，导致海平面上升、极端天气、物种大规模灭绝。最严重的后果不会发生在我们这一代，而是我们的孩子和孙辈的一生中。

      这引发了"代际正义"的问题：我们对未来的人有义务吗？有人说不应该——未来的人不存在，无法拥有权利，我们只对活着的人负责。但这个论证很危险：如果未来的人没有权利，我们就可以尽情污染、消耗资源，留给后代一个无法生存的星球。

      罗尔斯用"正义储存原则"来回答这个问题：每一代人应该为后代储存足够的资源，就像前一代为我们做的那样。但这留下了一个难题："足够"是多少？如果为了未来而牺牲当代穷人的发展权，是否也不正义？

      一个更直觉的思考方式是：想想你最爱的人——也许是你的弟弟妹妹、你的孩子或未来的孩子。你希望他们生活在一个什么样的世界？如果每个人都这样想，代际正义也许不需要复杂的哲学论证。
    story_source: 联合国政府间气候变化专门委员会报告
    suggested_thinkers: [rawls, hans-jonas]