  - id: society-001
    title: 教育公平
    description: 富裕家庭的孩子可以上好学校、请好老师，贫困家庭的孩子却连基本教育都难以保障。教育公平如何实现？
    category: society
    age_range: "10-14"
    guide_questions:
      - 教育是一种权利还是一种商品？
      - 家庭背景多大程度上决定了一个人的未来？
      - 如何在不降低整体质量的前提下实现教育公平？
    tags: [教育, 公平, 社会流动性, 阶层]
    story: |
      2020年疫情中，全球有超过16亿学生停课。在中国，城市孩子可以上网课，但偏远山区的孩子没有网络，有的甚至要走几公里山路到村委会蹭信号。这个对比揭示了一个残酷的现实：教育资源的分配极不平等。

      经济学有个概念叫"人力资本"——教育投资就像银行存款，越早存入收益越大。诺贝尔经济学奖得主詹姆斯·赫克曼发现，对弱势儿童早期教育的每一美元投资，社会回报高达7-12美元。但在现实中，最需要教育投资的孩子往往得到最少。

      中国古代的科举制度曾被认为是一种公平的制度——不管出身，只看成绩。但研究发现，科举考试中来自书香门第的考生远多于农家子弟，因为备考需要大量时间和资源。今天的"素质教育"也面临类似困境：钢琴、编程、辩论——这些"素质"需要金钱支撑。

      有人说，真正的教育公平不是给每个人相同的资源，而是给每个人足够的资源达到相同的标准——需要多的多给，需要少的少给。你觉得这公平吗？
    story_source: 詹姆斯·赫克曼早期教育投资研究
    suggested_thinkers: [rawls, confucius]

  - id: society-002
    title: 社交媒体是福还是祸
    description: 微信、抖音、Instagram连接了世界，但也带来了焦虑、网络暴力和信息茧房。
    category: society
    age_range: "8-14"
    guide_questions:
      - 社交媒体让你更快乐还是更焦虑？
      - 算法推荐是在帮助你还是在控制你？
      - 如果社交媒体消失，你的生活会怎样？
    tags: [社交媒体, 算法, 心理健康, 信息茧房]
    story: |
      2021年，前Facebook产品经理弗朗西斯·豪根公开了大量内部文件，揭露了令人不安的事实：Facebook自己的研究表明，Instagram对青少年女孩的心理健康有严重负面影响——三分之一的受访少女表示Instagram让她们对身体形象感到更差。但公司选择了隐藏这些研究。

      更深层的问题是"注意力经济"——社交媒体公司的利润来自你的停留时间，所以算法会不断推送让你"停不下来"的内容。前Google设计伦理学家特里斯坦·哈里斯称这为"注意力劫持"：算法比你更了解你的弱点，它会精准推送让你愤怒、焦虑或上瘾的内容，因为这些情绪让人停留最久。

      但社交媒体也带来了前所未有的连接——偏远地区的人可以学习知识，罕见病患者可以找到病友，社会运动可以迅速组织起来。阿拉伯之春中，社交媒体发挥了关键作用。

      也许问题不是社交媒体本身，而是谁控制它、以什么目标运行。如果社交媒体是为了服务用户而非剥削用户，它会是什么样子？
    story_source: 弗朗西斯·豪根举报事件
    suggested_thinkers: [foucault, marshall-mcluhan]

  - id: society-003
    title: 贫富差距是问题吗
    description: 全球最富有的1%人口拥有的财富超过了其余99%的总和。贫富差距本身是个问题吗？
    category: society
    age_range: "10-14"
    guide_questions:
      - 有人说"贫穷不是问题，不平等才是"——你同意吗？
      - 富人的财富是他们的"应得"吗？
      - 减少贫富差距应该靠税收、慈善还是市场？
    tags: [贫富差距, 不平等, 经济学, 社会正义]
    story: |
      2022年，乐施会发布报告：在过去两年中，全球最富有的10个人的财富翻了一倍，而全球有1.6亿人陷入了贫困。这种极端的贫富差距引发了广泛的社会讨论。

      但哲学家们对此有不同看法。自由至上主义者罗伯特·诺齐克认为，如果每个人的财富都是通过正当方式获得的，那么贫富差距就不是问题——就像篮球明星的收入远超常人，但只要没有人被强迫买票，就没有不正义。

      约翰·罗尔斯则认为，不平等只有在有利于最弱势群体时才可接受。如果一个经济体系让富人更富、穷人更穷，那就是不正义的。托马斯·皮凯蒂在《21世纪资本论》中用数据证明，资本回报率长期高于经济增长率，这意味着不靠劳动的"资本家"会越来越富，而靠劳动的人会被甩在后面。

      中国古人说"不患寡而患不均"——即使社会总体富裕，如果分配极端不均，也会导致社会不稳定。历史上，极端的贫富差距往往预示着社会动荡。但也有人说，适度的不平等激励人们努力工作和创新。你觉得这条线应该划在哪里？
    story_source: 乐施会全球不平等报告 / 皮凯蒂《21世纪资本论》
    suggested_thinkers: [rawls, nozick]

  - id: society-004
    title: 性别平等真的实现了吗
    description: 法律上的平等不等于事实上的平等。在职场、家庭和社会中，性别歧视仍然存在。
    category: society
    age_range: "10-14"
    guide_questions:
      - 为什么同工不同酬仍然存在？
      - "男主外女主内"的观念从何而来？
      - 性别平等对男性有什么好处？
    tags: [性别, 平等, 女权, 职场]
    story: |
      2023年，世界经济论坛发布的《全球性别差距报告》显示，按照目前的速度，实现全球性别平等还需要131年。在教育领域，性别差距已缩小95%，但在经济参与和政治赋权方面，差距仍然巨大。

      在中国，女性的劳动参与率从1990年的73%下降到2022年的61%。一个重要原因是"母职惩罚"——女性在生育后面临职业中断、晋升困难。调查显示，近六成女性求职时被问及婚育计划，而男性很少被问及。

      更隐蔽的歧视在于"隐性劳动"——女性平均每天花在无酬家务和照料上的时间是男性的2.5倍。这意味着女性实际上在工作之余还要"打第二份工"。

      波伏瓦说"女人不是天生的，而是被塑造成的"——性别不平等不是自然规律，而是社会建构。但改变观念比改变法律难得多。性别平等不仅对女性有利——当男性不再被期望"养家"和"不流泪"，他们也是性别刻板印象的受害者。
    story_source: 世界经济论坛《全球性别差距报告2023》
    suggested_thinkers: [simone-de-beauvoir, confucius]

  - id: society-005
    title: 移民与国界
    description: 全球有超过2.8亿移民。人们有权自由迁徙吗？国家有权关闭边界吗？
    category: society
    age_range: "10-14"
    guide_questions:
      - 你生在你所在的国家是运气还是权利？
      - 国界的道德依据是什么？
      - 如何平衡开放和秩序？
    tags: [移民, 国界, 全球正义, 身份]
    story: |
      2015年，叙利亚3岁男孩艾兰·库尔迪在试图偷渡希腊时溺亡，他面朝下趴在沙滩上的照片震惊了全世界。他的家人只是想逃离战乱，寻找一个安全的地方生活。但欧洲的边界对他们来说是不可逾越的。

      全球有超过1亿人流离失所，其中很多是因为战争、迫害或极端贫困。他们想去的不是某个特定的国家，而是一个安全、有尊严的生活——这是你出生就拥有的东西。

      支持开放边界的人说，出生在哪个国家完全是运气，凭什么运气好的人就可以享受安全与繁荣，运气差的人就只能在绝望中挣扎？反对者则担心，大规模移民会改变接收国的文化、压低工资、压垮公共服务。

      哲学家约瑟夫·卡伦斯提出一个有趣的类比：南非的种族隔离制度禁止黑人在"白人区"居住和工作——这被全世界谴责为不正义。但如果种族间的边界是错的，为什么国家间的边界就是对的？当然，国家边界有安全等正当理由，但我们需要思考：这些理由是否足以让人在战乱和饥饿面前紧闭大门？
    story_source: 艾兰·库尔迪事件 / 约瑟夫·卡伦斯移民伦理
    suggested_thinkers: [rawls, hannah-arendt]

  - id: society-006
    title: 工作的意义
    description: 随着自动化和AI的发展，很多工作将消失。工作的意义仅仅是赚钱吗？
    category: society
    age_range: "10-14"
    guide_questions:
      - 如果不需要工作就能生存，你还会工作吗？
      - 什么样的工作值得做？
      - AI取代人类工作是好事还是坏事？
    tags: [工作, 自动化, 意义, AI]
    story: |
      2023年，高盛发布报告预测，生成式AI可能影响全球3亿个工作岗位。这已经不是第一次了——工业革命取代了手工业者，自动化取代了工厂工人，互联网取代了很多传统行业。但这次不同的是，AI可能取代的不仅是体力劳动，还包括写作、编程、设计等"脑力劳动"。

      这让人思考：工作的意义是什么？马克思主义认为，在资本主义制度下，工作是"异化"的——工人不拥有产品、不控制过程、不了解整体。马克思设想，在未来社会中，劳动不再是谋生手段，而是人的自我实现的途径。

      尤瓦尔·赫拉利提出了"无用阶级"的概念：当AI可以做大部分工作时，很多人将不仅失业，而且"无用"——他们的技能不再被需要。如果工作不再存在，社会需要为人们提供新的意义来源。

      也有人乐观地认为，AI消除苦工，人类可以专注于创造性、关爱性和精神性的活动。画家、音乐家、志愿者——这些角色的价值从来不在经济产出。也许我们需要的不是"更多工作"，而是"重新定义工作的意义"。
    story_source: 高盛AI影响报告 / 尤瓦尔·赫拉利《未来简史》
    suggested_thinkers: [marx, aristotle]

  - id: society-007
    title: 消费主义的陷阱
    description: "双十一"一天的交易额超过数千亿。我们是在满足需求，还是被制造了需求？
    category: society
    age_range: "8-14"
    guide_questions:
      - 你上次买东西是因为需要还是因为想买？
      - 广告是在提供信息还是在操纵欲望？
      - 物质消费能带来持久的快乐吗？
    tags: [消费, 广告, 欲望, 环保]
    story: |
      2023年"双十一"，天猫交易额超过4000亿元。在这个购物狂欢中，很多人买了他们原本不需要的东西——打折的鞋子还在鞋柜里、囤的零食过期了、冲动买的衣服吊牌都没剪。

      经济学家加尔布雷斯在《富裕社会》中提出了"依赖效应"：在富裕社会中，生产创造了它所满足的需求。也就是说，不是先有需求再有产品，而是先有产品再通过广告创造需求。你以为是自己想买，其实是广告让你"想买"。

      心理学研究证实了"享乐适应"——新东西带来的快乐很快消退，然后你需要更新的东西来维持同样的快乐水平。这就像跑步机——不断奔跑，却留在原地。这也是为什么最富有的国家并不是最幸福的国家。

      更严重的是，消费主义驱动着环境破坏——每一件商品都需要资源、能源和废物处理。如果全球70亿人都按照美国人的方式消费，需要4个地球。也许第一步是问自己：这件东西我需要，还是我被"需要"了？
    story_source: 加尔布雷斯《富裕社会》
    suggested_thinkers: [marx, laozi]

  - id: society-008
    title: 互联网时代的孤独
    description: 我们从未如此连接，也从未如此孤独。互联网连接了我们，还是隔离了我们？
    category: society
    age_range: "8-14"
    guide_questions:
      - 有多少"好友"是真正的朋友？
      - 线上社交能替代面对面交流吗？
      - 孤独是一种个人问题还是社会问题？
    tags: [孤独, 社交, 互联网, 心理健康]
    story: |
      2023年，美国卫生局局长发布了一份关于孤独的公共卫生咨询，称孤独是一种"流行病"——约一半的美国成年人报告经历了可测量的孤独感。这不仅仅是情绪问题：研究显示，长期孤独的健康危害相当于每天抽15支烟。

      这似乎矛盾：我们生活在一个前所未有的"连接"时代——微信有超过12亿用户，平均每天在手机上花6-8小时。但"连接"不等于"联结"。人类学家罗宾·邓巴发现，人脑能维持的稳定社交关系最多约150人，而更深层的朋友关系通常不超过5人。社交网络上的数千"好友"，大多数只是"弱联系"。

      更糟糕的是，社交媒体展示的往往是别人生活中最精彩的部分——旅游、美食、成就。这制造了一种"别人都过得比我好"的错觉，心理学家称之为"社交比较"。

      心理学家约翰·卡乔波说，孤独的本质不是"身边没人"，而是"不被理解"。也许解决孤独的方法不是更多连接，而是更深层的连接——少刷手机，多面对面说心里话。
    story_source: 美国卫生局局长孤独流行病报告
    suggested_thinkers: [socrates, martin-buber]

  - id: society-009
    title: 老龄化社会
    description: 到2050年，全球65岁以上人口将翻倍。我们该如何面对老龄化社会？
    category: society
    age_range: "10-14"
    guide_questions:
      - 老年人是社会的负担还是财富？
      - 你希望自己在80岁时如何生活？
      - 年轻人有义务照顾老年人吗？
    tags: [老龄化, 养老, 代际关系, 社会保障]
    story: |
      2023年，中国60岁以上人口超过2.8亿，占总人口的近20%。日本更严重，65岁以上人口接近30%。全世界都在走向老龄化——这是人类历史上第一次，大多数社会将拥有大量老年人而非年轻人。

      这带来了严峻的挑战：养老金从哪里来？谁来照顾失能老人？医院如何应对慢性病潮？在日本，"孤独死"已成为社会问题——每年约3万人在无人陪伴中去世，其中大多数是独居老人。

      但老龄化也有另一面。日本冲绳是世界上"百岁老人"比例最高的地区之一，研究者发现他们的长寿秘诀是"ikigai"（生活意义）和"moai"（互助小组）——老年人不退休，而是继续从事自己热爱的事情，同时保持紧密的社交关系。

      孔子说"老有所养"是理想社会的基本标准。但现代社会中，年轻人自己都面临住房、就业压力，如何同时赡养老人？也许答案在于重新思考"衰老"——不是把它看作衰退，而是人生的另一个阶段，有其独特的价值和可能。
    story_source: 日本老龄化社会研究 / 冲绳长寿研究
    suggested_thinkers: [confucius, mencius]

  - id: society-010
    title: 少数人的声音
    description: 民主是多数人的统治，但少数人的权利谁来保护？当51%的人投票决定49%人的命运时，这是正义吗？
    category: society
    age_range: "10-14"
    guide_questions:
      - 多数人的决定一定是对的吗？
      - 如何保护少数群体不被多数人压迫？
      - 你是否曾经属于"少数"？
    tags: [民主, 少数权利, 多数暴政, 宪政]
    story: |
      古雅典是民主的发源地，但它的民主有一个黑暗的篇章。公元前399年，由501人组成的陪审团以280票对221票判处苏格拉底死刑——罪名是"腐蚀青年"和"不敬城邦之神"。这是民主制度历史上最著名的冤案之一：多数人的投票杀死了西方最伟大的哲学家。

      这让约翰·斯图亚特·密尔在《论自由》中提出了"多数暴政"的概念：民主最大的危险不在于政府专制，而在于社会多数对少数的压迫——通过舆论、习俗和投票，多数人可以让少数人窒息。

      现代宪法设计了保护少数的机制：权利法案（某些权利即使多数投票也不能剥夺）、司法审查（法院可以推翻违反基本权利的法律）、少数否决权等。但这些机制经常面临挑战——当多数人觉得自己的"意志"被法院阻止时，民主和权利之间就产生了张力。

      想想你所在的班级：如果投票决定午饭吃什么，51%选了A，49%就要吃A——即使他们讨厌A。在更大的社会中，这个"午饭"可能是语言权利、宗教自由、生活方式。保护少数人的声音，也许是衡量一个社会文明程度的最高标准。
    story_source: 苏格拉底审判 / 密尔《论自由》
    suggested_thinkers: [socrates, js-mill]