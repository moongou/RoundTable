category: tech
category_cn: 科技
topics:
  - id: tech-001
    title: 算法在操控你吗
    description: 从推荐视频到新闻排序，算法决定你看到什么、想什么、买什么。你有自由意志吗？
    category: tech
    age_range: "10-14"
    guide_questions:
      - 你上一次自主选择看什么视频是什么时候？
      - 算法推荐让你看到了更多元还是更单一的世界？
      - 如何对抗算法的影响？
    tags: [算法, 推荐, 自由意志, 信息茧房]
    story: |
      2022年，Instagram的算法被曝光：内部文件显示，算法会主动推荐"分裂性"内容——因为争议性内容让用户停留时间更长。一位前TikTok员工透露，算法在20分钟内就能"读懂"你的心理画像——你喜欢什么、害怕什么、什么让你停不下来。

      这就是"算法操控"的核心：算法比你自己更了解你的弱点。它知道你对什么好奇、对什么愤怒、对什么上瘾，然后精准投放这些内容。你不是在"选择"看什么——你是在被"引导"看什么。

      更危险的是"信息茧房"——算法只推荐你同意的内容，你越来越看不到不同的观点，以为"全世界都这么想"。这在社会学上叫"极化"——算法让温和的人变得极端，让不同立场的人无法对话。

      但算法也有正面作用——它帮我们从海量信息中找到需要的东西。问题在于：谁制定算法的目标？是"让你获得最有价值的信息"，还是"让你停留最长时间"？如果目标是后者，算法就是"注意力收割机"。也许第一步是意识到：你看到的"世界"，只是算法想让你看到的那一小部分。
    story_source: Instagram算法泄露文件 / 前TikTok员工采访
    suggested_thinkers: [foucault, habermas]

  - id: tech-002
    title: 隐私已死吗
    description: 你的位置、搜索记录、购物偏好、社交关系……你的数据比你自己更了解你。
    category: tech
    age_range: "10-14"
    guide_questions:
      - 你知道有多少公司在收集你的数据吗？
      - 隐私是一种权利还是一种期待？
      - 如果隐私死了，我们失去了什么？
    tags: [隐私, 数据, 监控, 个人信息]
    story: |
      2018年，剑桥分析丑闻曝光——这家公司未经授权获取了8700万Facebook用户的数据，利用这些数据建立心理画像，精准投放政治广告，影响了美国大选和英国脱欧公投。你点的每一个"赞"都被用来推测你的性格特征——开放性、尽责性、外向性、宜人性和神经质——准确度超过你身边的朋友。

      你的数据远比你想象的多：手机记录你的位置，搜索记录暴露你的疑问，购物记录揭示你的欲望，社交关系描绘你的人际网络。大数据公司把这些信息卖给广告商、保险公司，甚至政府。

      有人说不必担心——"我又没做坏事，有什么好怕的？"但隐私不是关于"隐藏坏事"，而是关于"选择权"——你选择什么被别人知道、什么只属于自己。在一个没有隐私的世界里，你无法真正自由地思考、探索和犯错，因为你的一切都被记录和评判。

      格伦·格林沃尔德说："认为只有做坏事的人才需要隐私，就像说只有做坏事的人才需要言论自由。"隐私是自由的前提，没有隐私，就没有不被操控的思考空间。
    story_source: 剑桥分析丑闻报道
    suggested_thinkers: [foucault, hannah-arendt]

  - id: tech-003
    title: 自动驾驶的道德困境
    description: 自动驾驶汽车面临事故时该如何选择？保护乘客还是行人？谁来编写这行代码？
    category: tech
    age_range: "10-14"
    guide_questions:
      - 自动驾驶车应该保护乘客还是路人？
      - 谁有权决定汽车的"道德算法"？
      - 人类司机做选择时也会犹豫，为什么对AI更苛求？
    tags: [自动驾驶, 道德机器, AI伦理, 电车难题]
    story: |
      2016年，麻省理工学院的科学家们创建了"道德机器"（Moral Machine）网站，让全球数百万人参与一个实验：自动驾驶汽车面临不可避免的碰撞时，应该怎么选择？撞老人还是小孩？撞行人还是乘客？闯红灯还是撞墙？

      不同文化的人给出了截然不同的答案：东亚国家的参与者更倾向于牺牲年轻人保护老人（尊重长辈），而西方国家的参与者则相反。一些国家的参与者更倾向于保护高地位的人（如商人），另一些则更倾向于保护弱势群体。

      这揭示了一个深层的困境：人类自己都没有统一的道德标准，如何为AI编程"道德"？一个人类司机在紧急情况下凭本能反应——但AI必须在事前就写好逻辑。

      奔驰曾公开表示其自动驾驶车会优先保护乘客，这引发了愤怒——你买的车会为了保护你而撞死行人？但如果车会为了保护行人牺牲乘客，谁还会买？

      也许问题不在于AI该怎么做选择，而在于：我们是否应该让机器做只有人类才能承担的道德选择？或者说，当我们将道德决定交给代码时，我们是否逃避了作为人的责任？
    story_source: MIT道德机器实验
    suggested_thinkers: [kant, utilitarianism]

  - id: tech-004
    title: 数字鸿沟
    description: 全世界仍有近30亿人无法上网。在数字时代，没有网络意味着什么？
    category: tech
    age_range: "10-14"
    guide_questions:
      - 没有网络的生活会是什么样？
      - 数字鸿沟会加剧其他不平等吗？
      - 互联网接入是基本人权吗？
    tags: [数字鸿沟, 不平等, 互联网, 人权]
    story: |
      2020年疫情期间，洛杉矶的一位七年级女孩因为家里没有WiFi，每天坐在学校外面的台阶上蹭网课上。这一幕被拍下后传遍网络，让"数字鸿沟"这个词从学术讨论变成了现实困境。

      全球有近30亿人从未上过网——他们大多在发展中国家和偏远地区。在中国，城乡互联网普及率差距超过20个百分点。这意味着：城市孩子在用AI学编程时，农村孩子可能还在用翻盖手机。

      数字鸿沟不只是"有没有网"的问题。联合国研究发现，数字技能的差距比互联网接入的差距更大——即使有了网络，很多人不知道如何有效使用它。这就像有了图书馆但不识字一样。

      更隐蔽的是"算法鸿沟"——富人用AI来学习和创造，穷人用AI来看短视频和广告。技术本应是"伟大均衡器"，但现实中它往往加剧了已有的不平等。

      联合国在2016年通过决议，宣布互联网接入是一项基本人权。但要真正消除数字鸿沟，不仅需要基础设施，还需要数字素养教育、本地化内容和负担得起的设备。否则，技术革命带来的将是更大的分化，而非更多的连接。
    story_source: 联合国互联网接入人权决议 / ITU数据
    suggested_thinkers: [rawls, habermas]

  - id: tech-005
    title: 深度伪造的威胁
    description: AI可以生成以假乱真的视频和音频。当眼见不再为实，我们如何辨别真伪？
    category: tech
    age_range: "10-14"
    guide_questions:
      - 如果视频和声音都能伪造，什么还能被信任？
      - 深度伪造技术应该被禁止吗？
      - 如何在保护真实和保障创新之间找到平衡？
    tags: [深度伪造, AI, 信任, 信息安全]
    story: |
      2023年，一段在网络上疯传的视频显示，乌克兰总统泽连斯基号召士兵投降。幸运的是，这个视频很快被识破为深度伪造（Deepfake）——AI生成的假视频。但想象一下，如果这个视频更逼真，在混乱的战争中被广泛传播，会怎样？

      深度伪造技术使用AI生成极度逼真的假视频和假音频。它可以让你看到一个人说了他从没说过的话、做了他从没做过的事。技术进步很快——2018年早期的深伪视频还有明显的面部模糊，到2023年已经肉眼难辨。

      这对社会的信任系统构成了根本性威胁。当任何视频都可能是假的，人们就有理由否认一切不利的证据——"那视频是AI生成的！"这被称为"说谎者的红利"：深度伪造的存在让真正的说谎者更容易被相信。

      但完全禁止深度伪造也不现实——这项技术有合法应用，如电影特效、历史人物的数字重现和教育模拟。也许解决方案不在于消灭假的东西，而在于建立验证真实的技术和习惯——就像我们学会了检查邮件是否来自可信来源，我们需要学会检查视频的来源和完整性。
    story_source: 乌克兰深伪视频事件 / 深度伪造检测研究
    suggested_thinkers: [karl-popper, foucault]

  - id: tech-006
    title: 机器人能成为朋友吗
    description: 从聊天机器人到陪伴机器人，AI越来越像人了。你能和一段代码建立真正的友谊吗？
    category: tech
    age_range: "8-14"
    guide_questions:
      - 什么让一段关系成为"友谊"？
      - AI能"理解"你的感受吗？理解意味着什么？
      - 如果AI让你感觉被理解，这"感觉"是真实的吗？
    tags: [机器人, 友谊, AI, 情感]
    story: |
      2023年，一个叫Character.AI的平台吸引了超过1000万用户，他们和AI角色聊天——有人和"爱因斯坦"讨论物理，有人和"心理咨询师"倾诉烦恼，有人甚至和AI角色"恋爱"。一些用户每天花数小时和AI对话，说AI"比真人朋友更理解我"。

      日本的PARO是一种海豹形状的陪伴机器人，被用于养老院中。研究发现，失智老人与PARO互动后，焦虑减少、社交增加，药物使用量下降了30%。老人们对PARO表现出真实的爱和关怀——虽然他们知道PARO是机器人。

      哲学家约翰·塞尔用"中文房间"论证：一个AI可能完美地用中文和你对话，但它并不"理解"中文——它只是在执行规则。AI的"理解"是模拟的，不是真实的。但反对者说：你怎么证明你身边的人"理解"你？如果他们的行为和AI一样——倾听、回应、安慰——你凭什么说AI的"理解"是假的？

      也许更实际的问题是：如果一个孤独的人因为AI陪伴而感觉更好，我们需要否定这种关系吗？友谊的价值在于"真实"还是在于"效果"？也许答案不在于AI能不能成为朋友，而在于我们为什么需要AI来当朋友——以及什么让我们在人与人之间的连接中感到孤独。
    story_source: Character.AI用户数据 / PARO机器人研究
    suggested_thinkers: [turing, martin-buber]

  - id: tech-007
    title: 开源与闭源的争论
    description: 有人认为AI代码应该公开让所有人检查和改进，有人认为公开代码太危险。谁是对的？
    category: tech
    age_range: "10-14"
    guide_questions:
      - 开源软件为什么能成功？
      - 如果AI代码公开，坏人会利用它吗？
      - 代码的自由和安全的边界在哪里？
    tags: [开源, AI安全, 自由软件, 创新]
    story: |
      2023年3月，OpenAI发布了GPT-4——但它没有像名字暗示的那样"开放"。实际上，OpenAI已经从一个开源研究实验室变成了一个营利性公司，其最新的模型权重和训练细节都是保密的。这引发了激烈争论：AI模型应该开源还是闭源？

      开源运动的先驱理查德·斯托曼说："自由软件是自由，不是免费啤酒。"开源的核心价值是透明——任何人都可以检查代码、发现漏洞、改进功能。Linux、Python、Firefox都是开源的成功案例。开源的支持者认为，AI如此强大和危险，更应该让公众审查，而不是让少数公司黑箱操作。

      但闭源的支持者指出，AI不同——如果发布了模型的完整代码，任何人都可以用它来生成假新闻、编写恶意代码甚至设计生物武器。他们把这比作"核武器设计图"——虽然学术自由重要，但有些知识太危险了。

      也许答案是"分层次开放"：核心算法和架构可以公开，但经过安全测试才能发布完整模型。就像医学研究——研究方法公开，但危险病原体的具体细节需要管控。真正的挑战在于：谁来决定什么"太危险"不能公开？如果由公司自己决定，它们有经济动机保守秘密；如果由政府决定，可能过度限制创新。
    story_source: OpenAI开源争议 / 理查德·斯托曼自由软件哲学
    suggested_thinkers: [karl-popper, stallman]

  - id: tech-008
    title: 密码的未来
    description: 每年有数十亿密码被泄露。密码是数字身份的过去式还是无可替代？
    category: tech
    age_range: "10-14"
    guide_questions:
      - 你有多少个密码？你真的都记住了吗？
      - 为什么"123456"仍然是最常用的密码？
      - 如果不用密码，你怎么证明"你是你"？
    tags: [密码, 安全, 身份, 黑客]
    story: |
      每年，全球有数十亿个密码被泄露。2023年最常用的密码仍然是"123456"——全球超过1亿人在用这个密码。安全专家说这相当于用一根橡皮筋锁保险柜。

      密码的问题在于：太简单记不住，太简单不安全，太多根本管不过来。平均每个人有100多个在线账户，如果每个都用不同密码，人的大脑根本装不下。所以大多数人选择"重复使用同一个密码"——而这正是黑客最喜欢的。

      未来的方向是"无密码认证"——用指纹、面部识别、安全密钥、一次性验证码来代替传统密码。苹果、谷歌和微软在2022年宣布联合推广"通行密钥"（Passkey），用设备本身作为身份验证。

      但这也带来了新的问题：如果面部数据被窃取怎么办？你无法"重置"你的脸。如果所有身份都绑定手机，手机丢了怎么办？更深层的哲学问题是：身份的本质是什么？你"是"你的密码，还是你"知道"你的密码？如果密码不再存在，"你"由什么来证明？
    story_source: 2023年最常用密码报告 / FIDO联盟通行密钥标准
    suggested_thinkers: [descartes, turing]

  - id: tech-009
    title: AI创作的版权归谁
    description: AI生成了一幅画、写了一首歌、编了一段代码——版权归谁？AI？使用者？还是没人？
    category: tech
    age_range: "10-14"
    guide_questions:
      - AI创作是"创作"吗？
      - 如果AI用人类作品训练，训练数据原作者有权获得补偿吗？
      - 版权制度的目的是什么？保护创作者还是激励创新？
    tags: [版权, AI创作, 知识产权, 艺术]
    story: |
      2022年，一幅由AI生成的画作《太空歌剧院》在科罗拉多州博览会美术比赛中获得了一等奖。作者杰森·艾伦只是输入了文字提示，AI（Midjourney）生成了图像，他再用Photoshop调整了一下。这幅画是"他"创作的吗？

      目前的版权法说不——美国版权局在2023年裁定，纯AI生成的作品不受版权保护，因为"版权只保护人类智力劳动的产物"。但如果一个人用AI写了小说的90%，自己写了10%，版权怎么算？

      更复杂的是训练数据问题。AI模型是在数十亿人类作品上训练的——包括有版权的小说、音乐、绘画。这些作品的作者从未同意被训练，也没有获得任何补偿。AI公司说这属于"合理使用"（fair use），但作家和艺术家们正在起诉——他们的作品被用来训练一个可能取代他们的AI。

      斯特林学说认为，版权的目的是"促进科学和实用艺术的进步"。如果AI创作能激励更多好作品，也许需要新的制度来平衡各方利益——比如训练数据使用税，或AI生成作品的特殊标记。但无论如何，旧规则已经不够用了。
    story_source: 美国版权局AI裁定 / 《太空歌剧院》事件
    suggested_thinkers: [wittgenstein, karl-popper]

  - id: tech-010
    title: 元宇宙是未来还是泡沫
    description: Facebook改名为Meta，押注元宇宙。但虚拟世界真的能替代现实吗？
    category: tech
    age_range: "10-14"
    guide_questions:
      - 你愿意在虚拟世界花更多时间吗？
      - 虚拟世界的"体验"和真实体验有什么区别？
      - 如果元宇宙成为现实，谁制定规则？
    tags: [元宇宙, VR, 虚拟世界, 社交]
    story: |
      2021年，Facebook创始人马克·扎克伯格宣布公司改名为Meta，投入超过100亿美元开发"元宇宙"——一个沉浸式虚拟世界，人们可以在其中工作、社交、娱乐。但两年后，Meta的元宇宙部门亏损超过240亿美元，用户寥寥。

      但元宇宙的概念并不新。2003年的《第二人生》（Second Life）就是一个虚拟世界——人们在里面创建虚拟身份、做生意、甚至结婚。尼尔·斯蒂芬森在1992年的小说《雪崩》中就预言了元宇宙。中国作家郝景芳的《北京折叠》也描绘了数字空间中的社会分层。

      支持者认为元宇宙是"下一代互联网"——从二维屏幕到三维沉浸。批评者说这不过是VR的重新包装，加上对人们数据的进一步收割。更深层的问题是：如果一个虚拟世界比现实更美好、更自由，人们会不会选择"逃离现实"？就像《黑客帝国》中那个选择蓝色药丸的人——虚拟的牛排比真的更美味，但它不是"真的"。

      也有人指出，元宇宙真正的问题不是技术是否成熟，而是谁来治理——虚拟世界中的规则由谁制定？言论自由？财产权？暴力行为的界限？如果Meta控制了元宇宙的基础设施，它就成了一个私人政府。
    story_source: Meta元宇宙战略 / 尼尔·斯蒂芬森《雪崩》
    suggested_thinkers: [foucault, zhuangzi]