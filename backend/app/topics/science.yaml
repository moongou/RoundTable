  - id: science-001
    title: 如果恐龙没有灭绝
    description: 假设那颗小行星没有撞击地球，恐龙继续进化，今天的世界会是什么样子？
    category: science
    age_range: "8-12"
    guide_questions:
      - 恐龙如果继续进化，可能发展出什么样的智慧？
      - 哺乳动物还有机会崛起吗？
      - 人类还会出现吗？
    tags: [恐龙, 进化, 小行星, 古生物]
    story: |
      6600万年前，一颗直径约10公里的小行星撞击了今天的墨西哥尤卡坦半岛。撞击产生的能量相当于数十亿颗原子弹，掀起的海啸高达300米，灰尘遮蔽了阳光长达数年。这次灾难导致了75%的物种灭绝，包括统治地球1.6亿年的恐龙。

      但如果那颗小行星偏了那么一点点，错过了地球呢？古生物学家斯蒂芬·杰伊·古尔德曾说，如果重放生命的录像带，结果可能完全不同。没有那次大灭绝，小型哺乳动物可能永远没有机会从恐龙的阴影中走出。恐龙可能继续进化——有些种类已经展现出群体行为和初步的社会性。会不会有恐龙发展出更大的脑容量？会不会有恐龙学会使用工具？

      科学家们提出了"恐龙人"假说：如果伤齿龙这种脑容量相对较大的恐龙继续进化数百万年，它们可能发展出类似灵长类的智力。当然，这只是一个思想实验，但它让我们思考：人类的诞生，究竟是必然还是偶然？
    story_source: 斯蒂芬·杰伊·古尔德《奇妙的生命》
    suggested_thinkers: [darwin, aristotle]

  - id: science-002
    title: 克隆人该被允许吗
    description: 1996年克隆羊多莉诞生后，克隆人的伦理争议从未停止。我们是否应该克隆人类？
    category: science
    age_range: "10-14"
    guide_questions:
      - 克隆人与被克隆者是什么关系？父子？双胞胎？
      - 克隆人会拥有和原体一样的记忆和性格吗？
      - 如果克隆人是为了器官移植，这道德吗？
    tags: [克隆, 基因, 伦理, 生物技术]
    story: |
      1996年7月5日，苏格兰罗斯林研究所的科学家伊恩·威尔穆特团队宣布了一个震惊世界的消息：他们成功克隆了一只名叫多莉的羊。多莉没有父亲，也没有传统意义上的母亲——她是第一只从成年体细胞克隆出来的哺乳动物。这意味着，从理论上讲，克隆人类也是可能的。

      消息一出，全世界陷入了激烈争论。美国总统克林顿立即下令禁止联邦资金用于克隆人研究。联合国后来通过了禁止生殖性克隆人的宣言。但科学家指出，治疗性克隆——即克隆胚胎以获取干细胞——可能有巨大的医学价值，可以用来治疗帕金森症、糖尿病等疾病。

      多莉只活了6岁半，远低于正常绵羊的寿命，这让人们担心克隆可能带来早衰等健康问题。但更重要的是伦理问题：克隆人是否有和常人一样的权利？如果有人愿意花巨资克隆自己或已故的亲人，社会应该允许吗？
    story_source: 伊恩·威尔穆特《多莉：克隆羊的诞生》
    suggested_thinkers: [socrates, confucius]

  - id: science-003
    title: 火星移民计划
    description: 埃隆·马斯克计划在2050年前将100万人送上火星。我们应该移民火星吗？
    category: science
    age_range: "10-14"
    guide_questions:
      - 火星移民是人类的冒险精神还是逃避责任？
      - 谁有权决定哪些人去火星？
      - 如果火星上发现了生命，我们还应该殖民吗？
    tags: [火星, 太空探索, 殖民, 未来]
    story: |
      2021年，SpaceX的星舰原型在一次高空测试中成功着陆又爆炸，但这没有阻止埃隆·马斯克的宏大计划——他设想在2050年前将100万人送上火星，建造自给自足的火星城市。火星的白天和黑夜与地球相近，有稀薄的大气层和冰冻的水，是人类目前最可行的星际移民目标。

      但火星的现实极其残酷：大气压力只有地球的1%，平均温度零下63度，没有磁场保护，表面遭受强烈的宇宙辐射。一个火星移民者将终生无法返回地球——因为火星的引力只有地球的38%，长期生活会使骨骼和肌肉退化到无法再适应地球。

      支持者认为，火星移民是人类文明的"备份"——如果地球遭受小行星撞击或核战争，至少人类不会灭绝。反对者则认为，我们应该把资源用来保护地球而不是逃离它。还有人说，火星移民将创造一个新的人类社会，没有地球上的历史包袱，也许能建立一个更公正的文明。你怎么看？
    story_source: 埃隆·马斯克火星殖民演讲
    suggested_thinkers: [hannah-arendt, zhuangzi]

  - id: science-004
    title: 人工智能会超越人类吗
    description: 从AlphaGo击败李世石到ChatGPT的横空出世，AI正在加速发展。AI会超越人类吗？
    category: science
    age_range: "10-14"
    guide_questions:
      - 什么是"超越"？在哪些方面AI已经超越人类？
      - AI能拥有意识吗？我们怎么判断？
      - 如果AI超越人类，人类还有存在的意义吗？
    tags: [人工智能, 意识, 未来, 奇点]
    story: |
      2016年3月，AlphaGo以4:1击败了世界围棋冠军李世石。围棋曾被认为是人工智能最难攻克的领域，因为它的变化比宇宙中的原子还多。AlphaGo不需要像人一样思考，它通过自我对弈数百万局，发现了人类几千年未曾发现的棋路。李世石说："我从未遇到过如此强大的对手。"

      2022年底，ChatGPT发布，它能写文章、编程序、翻译语言，甚至在某些考试中超过人类平均水平。AI科学家们开始严肃讨论"通用人工智能"（AGI）的可能性——即一种能在任何智力任务上达到或超越人类水平的AI。

      牛津大学哲学家尼克·博斯特罗姆在《超智》一书中警告：如果AI超越了人类智慧，它可能会成为人类"最后一个发明"，因为此后一切发明都将由AI来完成。但也有人说，AI只是工具，就像计算器超越了人类的算术能力，但并没有让数学家失业。关键可能不在于AI是否超越人类，而在于我们如何与AI共处。
    story_source: 尼克·博斯特罗姆《超智》
    suggested_thinkers: [turing, socrates]

  - id: science-005
    title: 基因编辑的边界
    description: CRISPR技术让基因编辑变得简单廉价，我们应该用它来"改良"人类吗？
    category: science
    age_range: "10-14"
    guide_questions:
      - 治疗遗传病和"增强"人类能力之间的界限在哪里？
      - 如果可以，你会编辑自己或孩子的基因吗？
      - 基因编辑会不会加剧社会不平等？
    tags: [基因编辑, CRISPR, 伦理, 生物技术]
    story: |
      2018年11月，中国科学家贺建奎宣布他使用CRISPR基因编辑技术修改了双胞胎婴儿的基因，使她们天生对HIV免疫。这一消息引发全球震惊——这是人类历史上第一次对人类胚胎进行基因编辑并导致活产。122位中国科学家联名谴责这是"疯狂"的行为。

      CRISPR就像基因的"文字处理器"——它能精确定位DNA序列并进行剪切、替换或插入。这项技术可以消除镰刀型细胞贫血症、囊性纤维化等数千种遗传病。但问题在于，同样的技术也可以用来"增强"人类——更高的智商、更强的肌肉、更长的寿命。

      这引发了"治疗"与"增强"的争论：消除遗传病似乎是好事，但如果富人可以为孩子购买"基因升级"，普通人将永远无法竞争。更危险的是，我们还不能完全理解基因的复杂性——编辑一个基因可能影响其他我们不知道的功能。我们是否应该在完全理解之前就按下编辑键？
    story_source: 贺建奎事件报道 / 珍妮弗·道德纳《破译者》
    suggested_thinkers: [confucius, kant]

  - id: science-006
    title: 动物有语言吗
    description: 蜜蜂用舞蹈传递食物位置，鲸鱼用歌声跨越海洋交流，鹦鹉能学会上百个词汇——这些算不算语言？
    category: science
    age_range: "8-12"
    guide_questions:
      - 语言和交流有什么区别？
      - 如果动物有语言，我们该如何对待它们？
      - 人类语言的独特性在哪里？
    tags: [动物, 语言, 交流, 认知科学]
    story: |
      1960年代，科学家们尝试教黑猩猩学手语。一只名叫沃肖的黑猩猩学会了130多个美式手语词汇，还能组合使用——比如"水鸟"指代天鹅，"打开食物饮料"要求打开冰箱。但批评者说，沃肖可能只是在模仿人类的动作来获得奖励，并不真正"理解"语言。

      2021年，麻省理工学院的科学家发现，埃及果蝠的叫声有类似人类语言的语法结构——它们用不同的音节组合来表达不同的意思。座头鲸的歌声可以持续数小时，并且会"流行"——某个族群发明的新曲调会传播到其他族群。

      哲学家维特根斯坦说过："如果狮子能说话，我们也无法理解它。"也许问题不在于动物有没有语言，而在于我们用人类的标准去衡量它们。蜜蜂的舞蹈对蜜蜂来说就是完美的语言——它精确地编码了距离和方向。如果"语言"的标准是"能传递复杂信息"，那很多动物都有语言。
    story_source: 坦普尔·葛兰汀《动物翻译官》
    suggested_thinkers: [wittgenstein, darwin]

  - id: science-007
    title: 时间旅行可能吗
    description: 从《时间机器》到《星际穿越》，时间旅行一直是科幻的热门主题。物理学允许时间旅行吗？
    category: science
    age_range: "10-14"
    guide_questions:
      - 如果你可以时间旅行，你会去过去还是未来？
      - 祖父悖论如何解决？
      - 如果时间旅行可能，为什么我们没见过时间旅行者？
    tags: [时间, 物理学, 相对论, 科幻]
    story: |
      爱因斯坦的相对论告诉我们，时间旅行到未来是可能的——至少理论上如此。如果你乘坐一艘接近光速的飞船旅行一年再返回，你会发现地球上已经过去了更长时间。这不是科幻，这是已被实验验证的物理事实：GPS卫星上的原子钟每天比地面的钟慢7微秒，正是因为它们在高速运动。

      但回到过去就困难多了。广义相对论允许一种叫做"闭合类时曲线"的数学解，物理学家基普·索恩发现，如果有一个虫洞（时空隧道），理论上可以通过它回到过去。但维持虫洞需要"负能量物质"，而这种物质是否存在还是未知。

      更根本的问题是"祖父悖论"：如果你回到过去杀死了自己的祖父，你就不会出生，也就无法回到过去。物理学家对此有两个回答：一是"自洽原则"——你回到过去所做的一切都已经成为历史的一部分，你无法改变已经发生的事；二是"多世界解释"——你回到过去创造了一个新的平行宇宙。
    story_source: 基普·索恩《星际穿越中的科学》
    suggested_thinkers: [einstein, zhuangzi]

  - id: science-008
    title: 宇宙是模拟的吗
    description: 越来越多的物理学家和哲学家认为，我们的宇宙可能是一个更高级文明的计算机模拟程序。
    category: science
    age_range: "10-14"
    guide_questions:
      - 如果宇宙是模拟的，我们怎么验证？
      - '模拟和真实的区别重要吗？'
      - 如果宇宙是模拟的，对我们的人生有什么影响？
    tags: [模拟假说, 物理, 哲学, 宇宙]
    story: |
      2003年，牛津大学哲学家尼克·博斯特罗姆提出了"模拟论证"：如果以下三个命题中有一个为真——(1)所有文明都在发展出超级计算机之前灭绝了，(2)先进文明对模拟祖先没兴趣，(3)我们几乎肯定生活在一个模拟中——那么我们很可能就生活在模拟中。

      一些物理学家找到了可疑的线索：量子力学中，粒子只有在被观测时才有确定的状态——这很像电子游戏只渲染玩家看到的画面来节省算力。宇宙有光速限制——这可能是模拟的"最大处理速度"。普朗克长度是空间的最小单位——这可能是"像素大小"。

      埃隆·马斯克说人类生活在模拟中的概率是"十亿分之一"。但即使这是真的，它重要吗？哲学家笛卡尔说过"我思故我在"——即使一切是幻觉，你的思考本身是真实的。如果宇宙是模拟的，但你的快乐、悲伤、爱都是真实体验的，那"真实"和"模拟"的区别还重要吗？
    story_source: 尼克·博斯特罗姆《我们生活在模拟中吗？》
    suggested_thinkers: [descartes, zhuangzi]

  - id: science-009
    title: 暗物质之谜
    description: 宇宙中85%的物质是我们看不见摸不着的暗物质，但它塑造了整个宇宙的结构。暗物质到底是什么？
    category: science
    age_range: "10-14"
    guide_questions:
      - 为什么科学家相信暗物质存在，如果没人见过它？
      - 暗物质可能是什么？
      - 如果暗物质不存在，我们该如何解释观测结果？
    tags: [暗物质, 宇宙, 天文学, 物理]
    story: |
      1933年，瑞士天文学家弗里茨·兹威基观察后发座星系团时发现了一个怪事：星系团中星系的运动速度太快了——按照可见物质的质量计算，这些星系早就应该飞散了。但它们却安稳地待在星系团中，就好像有大量看不见的物质在提供额外的引力。兹威基称之为"暗物质"。

      后来的观测不断证实暗物质的存在：星系的旋转曲线在边缘处不会按预期减速，引力透镜效应显示宇宙中有大量看不见的质量，宇宙微波背景辐射的精细结构也暗示暗物质的存在。现在我们知道，宇宙中大约85%的物质是暗物质，但我们完全不知道它是什么。

      科学家提出了许多候选者：WIMP、轴子、惰性中微子……但几十年的地下探测实验、对撞机实验和太空望远镜观测都没有找到确切的信号。一些物理学家开始怀疑：也许暗物质不存在，而是我们需要修改引力理论。这场宇宙中最深的谜团，等待你来思考。
    story_source: 丽莎·兰道尔《暗物质与恐龙》
    suggested_thinkers: [einstein, karl-popper]

  - id: science-010
    title: 量子纠缠的超距作用
    description: 两个纠缠的粒子，无论相距多远，对其中一个的测量会瞬间影响另一个。这违背了常识，但已被实验证实。
    category: science
    age_range: "10-14"
    guide_questions:
      - 爱因斯坦为什么称量子纠缠为"幽灵般的超距作用"？
      - 量子纠缠能用来超光速通信吗？
      - 宇宙的本质可能是非局域的吗？
    tags: [量子力学, 纠缠, 物理学, 爱因斯坦]
    story: |
      1935年，爱因斯坦和两位同事提出了一个思想实验，试图证明量子力学是不完备的。他们的论证基于一个看似荒谬的现象：如果两个粒子曾经相互作用过，那么无论它们分开多远——哪怕一个在地球，一个在半人马座——对其中一个粒子的测量都会瞬间决定另一个粒子的状态。爱因斯坦把这叫做"幽灵般的超距作用"，认为这不可能。

      但1964年，爱尔兰物理学家约翰·贝尔提出了一个不等式，可以通过实验来检验。1982年，法国物理学家阿兰·阿斯佩的实验结果违反了贝尔不等式，证明量子纠缠是真实的。2022年的诺贝尔物理学奖就颁给了三位证实量子纠缠的实验物理学家。

      关键在于，量子纠缠不能用来传递信息——因为你无法控制测量结果，所以也就无法通过纠缠发送信号。但它确实揭示了宇宙的一种深刻性质：在最基本的层面上，事物之间可以存在超越空间距离的关联。这种关联不是力，不是信号，而是一种更基本的联系。庄子的"天地与我并生，万物与我为一"，在量子层面或许有某种呼应。
    story_source: 阿兰·阿斯佩量子纠缠实验
    suggested_thinkers: [einstein, zhuangzi]