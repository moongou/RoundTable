name: roundtable
description: 圆桌思辨 - 小学生AI引导思辨讨论平台
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0
  # 网络
  dio: ^5.7.0
  web_socket_channel: ^3.0.0
  # LiveKit (Phase 2 语音集成)
  livekit_client: ^2.3.0
  # UI
  google_fonts: ^6.2.0
  flutter_animate: ^4.5.0
  audio_waveforms: ^1.1.0
  # 工具
  shared_preferences: ^2.3.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true